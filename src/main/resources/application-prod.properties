app.entorno.nombre=PRODUCCIÓN (PROD)

# Base de datos de producción ('proddb')
spring.datasource.url=jdbc:h2:mem:proddb
spring.datasource.driverClassName=org.h2.Driver

# Usuario con privilegios
spring.datasource.username=admin

# ${DB_PASSWORD:SecretPass123!}: Busca una Variable de Entorno del sistema llamada
# DB_PASSWORD. Si no la encuentra en el servidor, usa 'SecretPass123!' como valor por defecto.
# Jamás se deben escribir contraseñas reales en texto plano en archivos del código fuente.
spring.datasource.password=${DB_PASSWORD:SecretPass123!}

# REGLA DE SEGURIDAD VITAL: La consola web de H2 debe estar DESACTIVADA en producción,
# de lo contrario cualquiera en internet podría acceder a la BD mediante el navegador.
spring.h2.console.enabled=false

# En producción no se recrean ni destruyen tablas; se actualiza el esquema si hay cambios.
spring.jpa.hibernate.ddl-auto=update

# Ocultamos las consultas SQL en los logs por rendimiento y para evitar filtrar datos sensibles.
spring.jpa.show-sql=false

# REGLA DE SEGURIDAD: 'never' evita que se ejecute el script data.sql al arrancar.
# En producción no queremos insertar datos de prueba o 'dummy' automáticamente.
spring.sql.init.mode=never