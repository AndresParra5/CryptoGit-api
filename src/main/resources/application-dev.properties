# Propiedad personalizada que leemos en CryptoController para saber el entorno activo
app.entorno.nombre=DESARROLLO (DEV)

# === BASE DE DATOS H2 ===
# URL de conexión a la BD H2 en memoria llamada 'cryptodb'.
# Los datos existen mientras la aplicación esté encendida.
spring.datasource.url=jdbc:h2:mem:cryptodb

# Driver JDBC necesario para conectar Java con H2
spring.datasource.driverClassName=org.h2.Driver

# Usuario y contraseña por defecto de H2
spring.datasource.username=sa
spring.datasource.password=

# === CONSOLA GRÁFICA H2 ===
# Habilita la interfaz web en http://localhost:8080/h2-console para ver las tablas
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === JPA / HIBERNATE ===
# 'update': Hibernate compara las entidades @Entity con la BD y crea o modifica
# las tablas automáticamente sin borrar los datos existentes en la sesión.
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola del IDE las sentencias SQL reales que genera Hibernate
spring.jpa.show-sql=true

# Formatea el SQL impreso en varias líneas indentadas para que sea fácil de leer
spring.jpa.properties.hibernate.format_sql=true

# === SCRIPT INICIAL (data.sql) ===
# 'always': Fuerza a Spring a ejecutar el archivo src/main/resources/data.sql al arrancar.
spring.sql.init.mode=always

# 'true': Espera a que Hibernate cree la estructura de tablas antes de lanzar
# los 'INSERT' del data.sql (evita el error de "tabla no encontrada").
spring.jpa.defer-datasource-initialization=true