app.entorno.nombre=PRUEBAS (TEST)

# Usamos una base de datos en memoria con un nombre distinto ('testdb')
# para garantizar que los tests no contaminen ni usen datos de desarrollo.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# En los tests automatizados no hay un usuario navegando, por lo que
# desactivamos la consola gráfica de H2 para ahorrar memoria y tiempo de arranque.
spring.h2.console.enabled=false

# 'create-drop': Crea las tablas al empezar el test y las DESTRUYE completamente
# al finalizar. Garantiza que cada suite de tests empiece desde cero absoluto.
spring.jpa.hibernate.ddl-auto=create-drop

# Desactivamos el log de SQL para no ensuciar el informe de resultados de los tests.
spring.jpa.show-sql=false

# También cargamos el data.sql por si los tests necesitan datos iniciales predecibles.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true