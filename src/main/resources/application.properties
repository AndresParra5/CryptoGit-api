# Nombre de la aplicación (sirve para identificarse en logs o métricas)
spring.application.name=CryptoGit

# Puerto HTTP en el que escucha el servidor Tomcat embebido
server.port=8080

# Define el perfil activo por defecto. Si al arrancar no especificamos nada,
# Spring buscará y cargará automáticamente 'application-dev.properties'.
spring.profiles.active=dev

# === SWAGGER / OPENAPI ===
# Ruta donde SpringDoc genera la especificación JSON/YAML de OpenAPI
springdoc.api-docs.path=/v3/api-docs

# Ruta para acceder a la interfaz gráfica interactiva en el navegador
springdoc.swagger-ui.path=/swagger-ui.html

# Ordena alfabéticamente los controladores (@Tag) en la pantalla de Swagger UI
springdoc.swagger-ui.tags-sorter=alpha

# Ordena alfabéticamente los endpoints (GET, POST, etc.) dentro de cada controlador
springdoc.swagger-ui.operations-sorter=alpha