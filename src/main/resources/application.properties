spring.application.name=CryptoGit

# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS H2 EN MEMORIA (CryptoGit)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:cryptodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar la consola gráfica de H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización de datos semilla con data.sql
# Ejecuta data.sql siempre al arrancar la aplicación
spring.sql.init.mode=always
# Retrasa la ejecución de data.sql hasta que Hibernate haya creado las tablas
spring.jpa.defer-datasource-initialization=true